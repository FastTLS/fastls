name: HTTP3 lifecycle contracts

on:
  workflow_dispatch:
  push:
    branches: [v2, main, 'codex/h3-*']
  pull_request:
    paths:
      - '*.go'
      - go.mod
      - go.sum
      - .github/workflows/http3.yml

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        go: ['1.26.10', '1.27.3']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Core regression including real loopback H3 and 64 MiB transfers
        run: go test ./... -count=1 -timeout 120s
      - name: Static checks
        run: go vet ./...
      - name: Repeat H3 ownership and cancellation contracts
        run: go test . -run '^TestH3(RequestHeaderOverride|ExplicitResponseDecoding|CloseIdlePreservesActiveBody|PhaseTimeouts|ConnectTimeout|IdleCloseReleasesTransportAndReconnects|SessionCloseCancelsUnreadBody|CancellationPreservesSiblingStream|OneShotClosesOwnedTransport|DecodedSizeLimit|EarlyResponseReleasesBlockedUpload|ExplicitVersion.*|ForcedVersion.*|ConcurrentFirstUseAndClose|ResponseTrailers.*|RejectsRequestTrailers.*|TruncatedResponse.*)$' -shuffle=on -count=10 -timeout 90s
      - name: H3 race checks
        if: runner.os == 'Linux'
        run: go test -race . -run 'Test(H3|HTTP3|FastlsHTTP3)' -count=1 -timeout 180s
