# Ordinary main releases use CI's one clean Linux consumer. This matrix remains
# available for changed module graphs, manual compatibility checks and v2 work.
name: Clean external consumer

on:
  push:
    branches: [v2]
    paths:
      - '**/go.mod'
      - '**/go.sum'
      - 'profile/**'
      - 'imitate/**'
      - 'scripts/test-external-consumer.py'
      - 'scripts/external-consumer-dependencies.json'
      - '.github/workflows/external-consumer.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        go: ['1.26.10', '1.27.3']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Download immutable modules and perform a real request
        run: python scripts/test-external-consumer.py --fastls-ref "${{ github.event.pull_request.head.sha || github.sha }}"

  direct:
    name: Ubuntu / direct VCS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: Bypass module proxies and perform a real request
        run: python scripts/test-external-consumer.py --direct --fastls-ref "${{ github.event.pull_request.head.sha || github.sha }}"
