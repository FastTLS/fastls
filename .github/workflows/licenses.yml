name: License materials

on:
  push:
    paths:
      - '**/LICENSE'
      - '**/NOTICE'
      - '**/go.mod'
      - 'third_party/**'
      - 'THIRD_PARTY_NOTICES.md'
      - '.gitattributes'
      - 'scripts/check-licenses.py'
      - '.github/workflows/licenses.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Verify license texts, hashes and source archive contents
        run: python scripts/check-licenses.py
